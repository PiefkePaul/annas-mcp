name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Build CLI binary
        run: go build ./cmd/annas-mcp

  docker:
    # Gitea-Runner ubuntu-latest hat keinen Docker-Zugang; dort baut gitea-image.yml.
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build hosted HTTP image
        run: docker build -f Dockerfile --target http-runtime --tag annas-mcp:http-test .

      - name: Build local MCP image
        run: docker build -f Dockerfile --target mcp-stdio-runtime --tag annas-mcp:mcp-test .
