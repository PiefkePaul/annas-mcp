name: gitea-image

# Vorlage: NAS-Wiki infrastruktur/github-gitea-umzug/vorlage-docker-workflow
# main: baut und pusht latest + sha-<kurz> (HTTP-Variante, die auf der NAS läuft).
# PRs/andere Branches bauen nur. Kein Auto-Deploy: Stack per Hand auf sha-… stellen.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Push im LAN an gitea:3000 (Cloudflare vor git.scholz-cloud.de lehnt >100 MB ab).
# Gezogen wird dasselbe Image als git.scholz-cloud.de/scholz/annas-mcp.
env:
  DOCKER_BUILD_RECORD_UPLOAD: false
  REGISTRY: gitea:3000
  IMAGE: gitea:3000/scholz/annas-mcp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Auf der GitHub-Kopie nicht bauen (Registry und REGISTRY_TOKEN gibt es nur in Gitea).
    if: github.server_url != 'https://github.com'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '["self-hosted","nas","annas-mcp"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Builder im Netz des Slots: löst gitea:3000 auf, Klartext-HTTP
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."gitea:3000"]
              http = true
              insecure = true

      - name: Login Gitea-Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: piefkepaul
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Kurz-SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Bauen (und auf main pushen)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: http-runtime
          platforms: linux/amd64
          pull: true
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
